<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" role="img" aria-labelledby="title desc">
<title id="title">philosophers · 동시성 구조</title><desc id="desc">각 Philosopher Thread는 양옆 Fork Mutex를 잠그고 식사하며 hunger_time과 eat_cnt를 갱신한다. 생존 Monitor는 마지막 식사 시각을 검사하고, 목표 횟수 Monitor는 full_cnt를 검사한다.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#64748b"/></marker></defs>
<rect width="1000" height="500" rx="16" fill="#f8fafc"/><g font-family="Arial,'Noto Sans CJK KR','Malgun Gothic',sans-serif">
<text x="32" y="44" font-size="27" font-weight="700" fill="#17253b">philosophers · 동시성 구조</text>
<text x="32" y="74" font-size="16" fill="#4b5e78">Thread · Fork Mutex · 상태 갱신 · 종료 조건</text>
<rect x="32" y="105" width="936" height="124" rx="12" fill="#edf2ff" stroke="#b8c7e3"/>
<text x="52" y="137" font-size="17" font-weight="700" fill="#4865a0">01  Philosopher Thread</text>
<rect x="194" y="132" width="220" height="72" rx="10" fill="#fff" stroke="#cbd5e1"/><text x="212" y="162" font-size="18" font-weight="700" fill="#163b76">Philosopher i</text><text x="212" y="187" font-size="14" fill="#263a54">think → pick_up → eat → sleep</text>
<rect x="454" y="132" width="170" height="72" rx="10" fill="#fff" stroke="#cbd5e1"/><text x="472" y="162" font-size="17" font-weight="700" fill="#163b76">Right Fork</text><text x="472" y="187" font-size="14" fill="#263a54">Mutex</text>
<rect x="664" y="132" width="170" height="72" rx="10" fill="#fff" stroke="#cbd5e1"/><text x="682" y="162" font-size="17" font-weight="700" fill="#163b76">Left Fork</text><text x="682" y="187" font-size="14" fill="#263a54">Mutex</text>
<path d="M414 168 H444" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M624 168 H654" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="32" y="245" width="936" height="102" rx="12" fill="#fff" stroke="#b8c7e3"/>
<text x="52" y="277" font-size="17" font-weight="700" fill="#4865a0">02  상태</text>
<rect x="194" y="267" width="280" height="58" rx="10" fill="#f5f8ff" stroke="#cbd5e1"/><text x="212" y="292" font-size="17" font-weight="700" fill="#163b76">철학자별 상태</text><text x="212" y="315" font-size="14" fill="#263a54">hunger_time · eat_cnt</text>
<rect x="514" y="267" width="280" height="58" rx="10" fill="#f5f8ff" stroke="#cbd5e1"/><text x="532" y="292" font-size="17" font-weight="700" fill="#163b76">공통 상태</text><text x="532" y="315" font-size="14" fill="#263a54">full_cnt · is_surv</text>
<rect x="32" y="363" width="936" height="105" rx="12" fill="#ecf8f4" stroke="#a9d5c6"/>
<text x="52" y="395" font-size="17" font-weight="700" fill="#086b62">03  Monitor</text>
<rect x="194" y="386" width="285" height="58" rx="10" fill="#fff" stroke="#cbd5e1"/><text x="212" y="411" font-size="17" font-weight="700" fill="#086b62">생존 Monitor</text><text x="212" y="434" font-size="14" fill="#263a54">마지막 식사 시각 → 사망 조건</text>
<rect x="519" y="386" width="285" height="58" rx="10" fill="#fff" stroke="#cbd5e1"/><text x="537" y="411" font-size="17" font-weight="700" fill="#086b62">식사 횟수 Monitor</text><text x="537" y="434" font-size="14" fill="#263a54">full_cnt → 전원 목표 달성</text>
</g></svg>