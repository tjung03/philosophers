<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="390" viewBox="0 0 1000 390" role="img" aria-labelledby="title desc">
<title id="title">philosophers · Fork 공유 구조</title>
<desc id="desc">각 Philosopher Thread는 자신의 오른쪽 Fork와 왼쪽 Fork Mutex를 사용하며 두 Fork는 각각 이웃 Philosopher와 공유된다. 식사를 위해 두 Mutex를 잠그고 식사가 끝나면 해제한다.</desc>
<rect width="1000" height="390" rx="16" fill="#f8fafc"/>
<g font-family="Arial,'Noto Sans CJK KR','Malgun Gothic',sans-serif">
<text x="32" y="44" font-size="27" font-weight="700" fill="#17253b">philosophers · Fork 공유 구조</text>
<text x="32" y="74" font-size="16" fill="#4b5e78">Philosopher Thread 하나를 기준으로 본 두 Fork Mutex 관계</text>

<rect x="32" y="108" width="936" height="218" rx="12" fill="#edf2ff" stroke="#b8c7e3"/>

<rect x="100" y="165" width="210" height="100" rx="12" fill="#fff" stroke="#cbd5e1"/>
<text x="122" y="199" font-size="20" font-weight="700" fill="#163b76">Fork i-1</text>
<text x="122" y="229" font-size="15" fill="#263a54">Left Fork Mutex</text>
<text x="122" y="252" font-size="13" fill="#64748b">이웃 Philosopher와 공유</text>

<rect x="395" y="145" width="210" height="140" rx="12" fill="#fff6ea" stroke="#e5cba9"/>
<text x="417" y="180" font-size="20" font-weight="700" fill="#946018">Philosopher i</text>
<text x="417" y="211" font-size="15" fill="#263a54">Thread</text>
<text x="417" y="240" font-size="14" fill="#263a54">Right → Left 순서로 lock</text>
<text x="417" y="263" font-size="14" fill="#263a54">eat 후 두 Fork unlock</text>

<rect x="690" y="165" width="210" height="100" rx="12" fill="#fff" stroke="#cbd5e1"/>
<text x="712" y="199" font-size="20" font-weight="700" fill="#163b76">Fork i</text>
<text x="712" y="229" font-size="15" fill="#263a54">Right Fork Mutex</text>
<text x="712" y="252" font-size="13" fill="#64748b">이웃 Philosopher와 공유</text>

<line x1="310" y1="215" x2="395" y2="215" stroke="#64748b" stroke-width="2"/>
<line x1="605" y1="215" x2="690" y2="215" stroke="#64748b" stroke-width="2"/>

<text x="100" y="355" font-size="14" fill="#475569">행동 반복: pick_up → eat → sleep → think · 짝수 번호 Thread는 시작 시점을 식사 시간만큼 늦춰 분산</text>
</g></svg>