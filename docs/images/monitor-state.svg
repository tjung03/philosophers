<path d="M310 284 H445" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M685 184 H750 V225 H780" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
