<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="390" viewBox="0 0 1000 390" role="img" aria-labelledby="title desc">
<title id="title">philosophers · 상태와 Monitor</title>
<desc id="desc">각 Philosopher의 hunger_time과 eat_cnt는 철학자별 상태로 관리된다. full_cnt와 is_surv는 공통 상태다. 생존 Monitor는 hunger_time을 검사해 사망을 판단하고, 최소 식사 횟수를 지정한 경우 식사 횟수 Monitor가 full_cnt를 확인한다.</desc>
