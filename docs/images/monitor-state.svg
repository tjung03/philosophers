<g font-family="Arial,'Noto Sans CJK KR','Malgun Gothic',sans-serif">
<text x="32" y="44" font-size="27" font-weight="700" fill="#17253b">philosophers · 상태와 Monitor</text>
<text x="32" y="74" font-size="16" fill="#4b5e78">Per-Philosopher State · Shared State · 종료 조건</text>

<rect x="32" y="108" width="936" height="220" rx="12" fill="#ecf8f4" stroke="#a9d5c6"/>

<rect x="80" y="145" width="230" height="78" rx="10" fill="#fff" stroke="#cbd5e1"/>
<text x="102" y="176" font-size="18" font-weight="700" fill="#086b62">철학자별 상태</text>
<text x="102" y="204" font-size="14" fill="#263a54">hunger_time · eat_cnt</text>

<rect x="80" y="245" width="230" height="78" rx="10" fill="#fff" stroke="#cbd5e1"/>
<text x="102" y="276" font-size="18" font-weight="700" fill="#086b62">공통 상태</text>
<text x="102" y="304" font-size="14" fill="#263a54">full_cnt · is_surv</text>

<rect x="455" y="145" width="230" height="78" rx="10" fill="#fff" stroke="#cbd5e1"/>
<text x="477" y="176" font-size="18" font-weight="700" fill="#086b62">생존 Monitor</text>
<text x="477" y="204" font-size="14" fill="#263a54">마지막 식사 시각 검사</text>

<rect x="455" y="245" width="230" height="78" rx="10" fill="#fff" stroke="#cbd5e1"/>
<text x="477" y="276" font-size="18" font-weight="700" fill="#086b62">식사 횟수 Monitor</text>
<text x="477" y="304" font-size="14" fill="#263a54">full_cnt 확인</text>

